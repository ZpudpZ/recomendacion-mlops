services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recsys_backend
    restart: unless-stopped
    environment:
      - MODEL_PATH=/app/artifacts/svd_model.pkl
      - METADATA_PATH=/app/artifacts/item_metadata.parquet
      - ALLOWED_ORIGINS=*
    volumes:
      - ./ml_pipeline/artifacts:/app/artifacts:ro
    ports:
      - "8000:8000"
    networks:
      - recsys_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: recsys_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - recsys_net

networks:
  recsys_net:
    driver: bridge